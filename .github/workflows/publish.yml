name: Publicar no Instagram

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar itens que chegaram na hora
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PUBLIC_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: node publish.mjs
      - name: Salvar o que foi publicado
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "agendador-jogaleria"
            git config user.email "agendador@users.noreply.github.com"
            git add published.json
            git commit -m "Atualiza published.json"
            git push
          fi
